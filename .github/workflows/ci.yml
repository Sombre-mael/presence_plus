name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://presence_plus:presence_plus@127.0.0.1:5432/presence_plus
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      AUTH_EMAIL_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: quality
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: presence-plus-neon-e2e
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_E2E }}
      DATABASE_URL_E2E: ${{ secrets.DATABASE_URL_E2E }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET_E2E }}
      AUTH_SECRET_E2E: ${{ secrets.AUTH_SECRET_E2E }}
      AUTH_E2E_PASSWORD: ${{ secrets.AUTH_E2E_PASSWORD }}
      AUTH_EMAIL_MODE: mock
      E2E_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec prisma validate
      - run: pnpm db:migrate:deploy
      - run: pnpm build
      - run: pnpm test:e2e
